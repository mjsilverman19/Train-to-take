name = "train"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Fires at 13:00 and 14:00 UTC Mon–Fri. The scheduled handler filters to
# whichever one corresponds to 9 AM America/New_York (DST-aware).
[triggers]
crons = ["0 13,14 * * 1-5"]

# Stores one snapshot per weekday written by the scheduled handler.
[[kv_namespaces]]
binding = "HISTORY"
id = "0e2ed4867a3f4c1faab06bf1083ca89a"
